<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComicCraft - Your Comic Preview</title>
  <style>
    body { margin: 0; padding: 24px 12px 48px; background: #eef0f3; font-family: "Segoe UI", Arial, sans-serif; color: #222; }
    h1 { text-align: center; font-size: 22px; margin: 0 0 20px; }
    .panel {
      width: 760px; max-width: 100%; margin: 0 auto 24px; background: #fff; padding: 18px 22px;
      border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.15);
    }
    .panel h2 { font-size: 18px; margin: 0 0 12px; }
    .panel img { display: block; max-width: 100%; width: 512px; height: auto; border-radius: 6px; margin-bottom: 10px; }
    .scene { font-style: italic; color: #555; font-size: 14px; margin: 0 0 12px; }
    .text { font-size: 15px; line-height: 1.55; }
    .actions { text-align: center; margin-top: 8px; }
    .download {
      display: inline-block; padding: 14px 30px; background: #0b63ce; color: #fff; text-decoration: none;
      font-size: 18px; font-weight: 700; border-radius: 8px; box-shadow: 0 3px 8px rgba(0,0,0,.25);
    }
    .download:hover { background: #084b9c; }
  </style>
</head>
<body>
  <h1>&#128214; Your Comic Preview</h1>

  {% for panel in layout %}
  <div class="panel">
    <h2>Panel {{ panel.panel }}: {{ panel.title }}</h2>
    <img src="/{{ panel.image_path }}" alt="Illustration for panel {{ panel.panel }}">
    <p class="scene">{{ panel.scene_description }}</p>
    <div class="text">{{ panel.text | format_text }}</div>
  </div>
  {% endfor %}

  <div class="actions">
    <a class="download" id="download-btn" href="/{{ pdf_path }}" download>&#128229; Download Your Comic as PDF</a>
  </div>

  <script>
    // After the PDF download starts, move to the export success page
    document.getElementById("download-btn").addEventListener("click", function () {
      setTimeout(function () {
        window.location.href = "/export-success?pdf_path=" + encodeURIComponent("{{ pdf_path }}");
      }, 1200);
    });
  </script>
</body>
</html>
